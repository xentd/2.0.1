<title>Heart of Twenty Tongues</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500&family=Noto+Sans:wght@500;700&family=Syncopate:wght@400;700&display=swap">
<style>
/* Layout: full-bleed WebGL stage; HUD pinned to the four corners; 20-word ring projected from 3D space */
:root{
  --void:#06010b;
  --blood:#9e0029;
  --rose:#ff2e63;
  --blush:#ff9fb8;
  --plasma:#fff0f4;
  --dim:rgba(255,159,184,.6);
  --hair:rgba(255,46,99,.32);
  --display:"Syncopate","Arial Black",Impact,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --word:"Noto Sans",system-ui,"Segoe UI","Hiragino Sans","Apple SD Gothic Neo","Noto Sans CJK SC","Noto Sans Devanagari","Noto Sans Arabic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--plasma);overflow:hidden;font-family:var(--mono);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
#rain{position:fixed;inset:0;width:100%;height:100%;mix-blend-mode:screen;opacity:.42;pointer-events:none}
.fx{position:fixed;inset:0;pointer-events:none}
.fx.scan{background:repeating-linear-gradient(to bottom,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
.fx.vig{background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(6,1,11,.85) 100%)}

#words{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#words span{position:absolute;left:0;top:0;white-space:nowrap;font-family:var(--word);font-weight:700;color:var(--plasma);
  text-shadow:0 0 6px var(--rose),0 0 18px rgba(255,46,99,.8),0 0 42px rgba(158,0,41,.9);pointer-events:auto;cursor:pointer;will-change:transform,opacity;letter-spacing:.01em}
#words span small{display:block;font-family:var(--mono);font-weight:300;font-size:.38em;letter-spacing:.22em;color:var(--blush);text-shadow:none;text-align:center;margin-top:.2em;opacity:.8}

#headline{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:min(92vw,900px)}
#hl-word{font-family:var(--word);font-weight:700;font-size:clamp(28px,6.2vw,76px);line-height:1.1;color:#fff;text-wrap:balance;
  text-shadow:0 0 8px #fff,0 0 22px var(--rose),0 0 60px var(--rose),0 0 120px var(--blood);transition:opacity .6s}
#hl-meta{margin-top:.7em;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--blush);transition:opacity .6s}
#hl-meta b{color:#fff;font-weight:500}

.hud{position:fixed;font-size:11px;letter-spacing:.08em;color:var(--dim);pointer-events:none}
.hud .bracket{position:absolute;width:14px;height:14px;border-color:var(--rose);border-style:solid;opacity:.8}
#tl{top:calc(18px + env(safe-area-inset-top,0px));left:calc(18px + env(safe-area-inset-left,0px))}
#tl h1{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.42em;color:var(--plasma);margin:0 0 6px;text-shadow:0 0 12px var(--rose)}
#tl p{margin:0;letter-spacing:.24em;text-transform:uppercase;font-size:10px}
#tr{top:calc(18px + env(safe-area-inset-top,0px));right:calc(18px + env(safe-area-inset-right,0px));text-align:right}
#bpm{font-family:var(--display);font-size:22px;color:#fff;letter-spacing:.06em;text-shadow:0 0 14px var(--rose);font-variant-numeric:tabular-nums}
#bpm small{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--blush);margin-left:6px}
#ecg{display:block;width:170px;height:46px;margin-top:6px;margin-left:auto;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
#bl{left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(430px,calc(100vw - 36px))}
#term{font-size:11px;line-height:1.65;color:var(--blush);white-space:pre;overflow:hidden;min-height:calc(1.65em * 7);display:flex;flex-direction:column;justify-content:flex-end;
  border-left:1px solid var(--hair);padding-left:10px;font-variant-numeric:tabular-nums}
#term .ok{color:#fff}
#term .k{color:var(--rose)}
#term .caret{display:inline-block;width:.6em;height:1em;background:var(--rose);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#br{right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));pointer-events:auto;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#br .row{display:flex;gap:8px}
button{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--plasma);background:rgba(158,0,41,.18);
  border:1px solid var(--hair);padding:10px 14px;cursor:pointer;position:relative;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:background .25s,border-color .25s,box-shadow .25s}
button:hover{background:rgba(255,46,99,.28);border-color:var(--rose);box-shadow:0 0 18px rgba(255,46,99,.45)}
button:focus-visible{outline:1px solid #fff;outline-offset:3px}
button.primary{border-color:var(--rose);background:rgba(255,46,99,.22)}
#hint{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}

@media (max-width:640px){
  #bl{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  #term{font-size:10px;min-height:calc(1.65em * 5)}
  #br{left:calc(18px + env(safe-area-inset-left,0px));align-items:stretch}
  #br .row button{flex:1}
  #hint{display:none}
  #ecg{width:120px;height:36px}
  #tl h1{font-size:11px;letter-spacing:.3em}
}
#fail[hidden]{display:none}
#fail{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font-size:13px;color:var(--blush)}
</style>

<canvas id="stage" aria-label="A 3D particle heart that opens to reveal 'I love you' in 20 languages"></canvas>
<canvas id="rain" aria-hidden="true"></canvas>
<div class="fx vig"></div>
<div class="fx scan"></div>
<div id="words" aria-hidden="true"></div>
<div id="headline" aria-live="polite"><div id="hl-word"></div><div id="hl-meta"></div></div>

<div class="hud" id="tl"><h1>AMOR.CORE</h1><p>Heart of Twenty Tongues</p></div>
<div class="hud" id="tr"><div id="bpm">064<small>BPM</small></div><canvas id="ecg"></canvas></div>
<div class="hud" id="bl"><div id="term"></div></div>
<div class="hud" id="br">
  <div id="hint">tap heart · drag to orbit · space</div>
  <div class="row">
    <button id="sound" type="button">Sound off</button>
    <button id="toggle" class="primary" type="button">Open heart</button>
  </div>
</div>
<div id="fail" hidden>This heart needs WebGL. Try a recent desktop or mobile browser.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function(){
"use strict";
const LANGS=[
  ["en","English","I love you"],
  ["es","Español","Te amo"],
  ["fr","Français","Je t’aime"],
  ["de","Deutsch","Ich liebe dich"],
  ["it","Italiano","Ti amo"],
  ["pt","Português","Eu te amo"],
  ["ru","Русский","Я тебя люблю"],
  ["ja","日本語","愛してる"],
  ["zh","中文","我爱你"],
  ["ko","한국어","사랑해"],
  ["ar","العربية","أحبك"],
  ["hi","हिन्दी","मुझे तुमसे प्यार है"],
  ["tr","Türkçe","Seni seviyorum"],
  ["nl","Nederlands","Ik hou van jou"],
  ["el","Ελληνικά","Σ’ αγαπώ"],
  ["sv","Svenska","Jag älskar dig"],
  ["pl","Polski","Kocham cię"],
  ["id","Bahasa Indonesia","Aku cinta kamu"],
  ["sw","Kiswahili","Nakupenda"],
  ["tl","Tagalog","Mahal kita"]
];
const N_LANG=LANGS.length;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const small=Math.min(innerWidth,innerHeight)<600;
const $=id=>document.getElementById(id);

if(typeof THREE==="undefined"){ $("fail").hidden=false; return; }

/* ---------- renderer ---------- */
const canvas=$("stage");
let renderer;
try{ renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:"high-performance"}); }
catch(e){ $("fail").hidden=false; return; }
const PR=Math.min(devicePixelRatio||1,2);
renderer.setPixelRatio(PR);
renderer.setClearColor(0x06010b,1);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,1,0.1,300);
camera.position.set(0,0.3,9);

let controls=null;
if(THREE.OrbitControls){
  controls=new THREE.OrbitControls(camera,canvas);
  controls.enableDamping=true; controls.dampingFactor=0.06;
  controls.enablePan=false; controls.rotateSpeed=0.6; controls.zoomSpeed=0.6;
}

let composer=null,bloom=null;
if(THREE.EffectComposer&&THREE.UnrealBloomPass){
  composer=new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene,camera));
  bloom=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.15,0.6,0.08);
  composer.addPass(bloom);
}

/* ---------- textures ---------- */
function canvasTex(w,h,draw){const c=document.createElement("canvas");c.width=w;c.height=h;draw(c.getContext("2d"),w,h);const t=new THREE.CanvasTexture(c);return t;}
const glowTex=canvasTex(256,256,(g,w)=>{const r=g.createRadialGradient(w/2,w/2,0,w/2,w/2,w/2);
  r.addColorStop(0,"rgba(255,255,255,1)");r.addColorStop(.12,"rgba(255,190,210,.9)");r.addColorStop(.35,"rgba(255,46,99,.35)");r.addColorStop(1,"rgba(255,0,60,0)");g.fillStyle=r;g.fillRect(0,0,w,w);});
const rayTex=canvasTex(64,256,(g,w,h)=>{const a=g.createLinearGradient(0,0,w,0);a.addColorStop(0,"rgba(255,255,255,0)");a.addColorStop(.5,"rgba(255,255,255,1)");a.addColorStop(1,"rgba(255,255,255,0)");
  g.fillStyle=a;g.fillRect(0,0,w,h);g.globalCompositeOperation="destination-in";const b=g.createLinearGradient(0,h,0,0);b.addColorStop(0,"rgba(0,0,0,1)");b.addColorStop(1,"rgba(0,0,0,0)");g.fillStyle=b;g.fillRect(0,0,w,h);});
const heartTex=canvasTex(64,64,(g)=>{g.translate(32,34);g.scale(1.7,1.7);g.beginPath();
  for(let i=0;i<=60;i++){const t=i/60*Math.PI*2,s=Math.sin(t);const x=s*s*s*16/1.6,y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/1.6;i?g.lineTo(x,y):g.moveTo(x,y);}
  g.closePath();g.shadowColor="#fff";g.shadowBlur=6;g.fillStyle="#fff";g.fill();});

/* ---------- heart geometry ---------- */
function heartXY(t){const s=Math.sin(t);return[s*s*s*1.6,(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)+2.5)*0.1];}
const DEPTH=0.78;
function buildHeart(n,mode){
  const pos=new Float32Array(n*3),side=new Float32Array(n),rnd=new Float32Array(n*3),size=new Float32Array(n),tone=new Float32Array(n);
  for(let i=0;i<n;i++){
    const t=Math.random()*Math.PI*2,[hx,hy]=heartXY(t),r=Math.random();let k,z;
    if(mode==="core"){k=Math.cbrt(Math.random());z=(Math.random()*2-1)*DEPTH*Math.sqrt(Math.max(0,1-k*k));}
    else if(r<0.26){k=1+(Math.random()-0.5)*0.025;z=(Math.random()-0.5)*0.1;}
    else if(r<0.92){k=Math.sqrt(Math.random());z=(Math.random()<0.5?-1:1)*DEPTH*Math.sqrt(Math.max(0,1-k*k))+(Math.random()-0.5)*0.035;}
    else{k=Math.random();z=(Math.random()*2-1)*DEPTH*Math.sqrt(1-k*k)*0.85;}
    const x=hx*k,y=hy*k;
    pos[i*3]=x;pos[i*3+1]=y;pos[i*3+2]=z;
    side[i]=x<0?-1:1;
    rnd[i*3]=Math.random()*2-1;rnd[i*3+1]=Math.random()*2-1;rnd[i*3+2]=Math.random()*2-1;
    size[i]=0.55+Math.pow(Math.random(),3)*1.4;
    tone[i]=Math.random();
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.BufferAttribute(pos,3));
  g.setAttribute("aSide",new THREE.BufferAttribute(side,1));
  g.setAttribute("aRnd",new THREE.BufferAttribute(rnd,3));
  g.setAttribute("aSize",new THREE.BufferAttribute(size,1));
  g.setAttribute("aTone",new THREE.BufferAttribute(tone,1));
  return g;
}

const U={uTime:{value:0},uOpen:{value:0},uBeat:{value:0},uScatter:{value:1},uPR:{value:PR},uSize:{value:22},uCore:{value:0}};

const shellMat=new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
vertexShader:`
uniform float uTime,uOpen,uBeat,uScatter,uPR,uSize;
attribute float aSide,aSize,aTone; attribute vec3 aRnd;
varying vec3 vCol; varying float vA;
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
void main(){
  vec3 p=position;
  float seam=smoothstep(0.16,0.0,abs(p.x));
  float sc=clamp(uScatter*1.45-aTone*0.45,0.0,1.0); sc=sc*sc*(3.0-2.0*sc);
  vec3 far=aRnd*vec3(10.0,6.5,7.0);
  far.xz=rot(sc*5.0+aTone*6.2831)*far.xz;
  p=mix(p,far,sc);
  p*=1.0+uBeat*0.075*(1.0-uOpen*0.5);
  p+=0.018*sin(uTime*2.2+aRnd*31.0);
  float o=uOpen;
  vec3 piv=vec3(0.0,0.0,-0.5);
  p-=piv; p.xz=rot(o*1.05*aSide)*p.xz; p+=piv;
  p.x+=aSide*o*1.05; p.y+=o*0.12;
  float tr=sin(o*3.14159);
  p+=aRnd*tr*0.5;
  vec4 mv=modelViewMatrix*vec4(p,1.0);
  gl_Position=projectionMatrix*mv;
  gl_PointSize=uSize*aSize*uPR*(1.0+uBeat*0.25)/(-mv.z);
  vec3 deep=vec3(0.5,0.0,0.08),hot=vec3(1.0,0.1,0.32),white=vec3(1.0,0.86,0.92);
  vec3 c=mix(deep,hot,aTone);
  c=mix(c,white,pow(aTone,9.0));
  c+=white*seam*o*1.4;
  c*=0.7+uBeat*0.65+sc*0.6;
  vCol=c; vA=0.8;
}`,
fragmentShader:`
varying vec3 vCol; varying float vA;
void main(){vec2 c=gl_PointCoord-0.5;float d=length(c);if(d>0.5)discard;float a=smoothstep(0.5,0.0,d);a*=a;gl_FragColor=vec4(vCol,a*vA);}`});

const coreMat=new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
vertexShader:`
uniform float uTime,uBeat,uPR,uSize,uCore;
attribute float aSize,aTone; attribute vec3 aRnd;
varying vec3 vCol;
void main(){
  vec3 p=position*(0.42+uBeat*0.06)*uCore;
  float a=uTime*0.6+aTone*6.2831;
  p+=vec3(cos(a),sin(a*1.3),sin(a))*0.05*uCore;
  p+=aRnd*(1.0-uCore)*0.2;
  vec4 mv=modelViewMatrix*vec4(p,1.0);
  gl_Position=projectionMatrix*mv;
  gl_PointSize=uSize*aSize*uPR*1.1/(-mv.z);
  vCol=mix(vec3(1.0,0.35,0.55),vec3(1.0,0.95,0.97),aTone)*(0.6+uBeat*0.8)*uCore;
}`,
fragmentShader:`
varying vec3 vCol;
void main(){vec2 c=gl_PointCoord-0.5;float d=length(c);if(d>0.5)discard;float a=smoothstep(0.5,0.0,d);gl_FragColor=vec4(vCol,a*a);}`});

const heartGroup=new THREE.Group();scene.add(heartGroup);
const shell=new THREE.Points(buildHeart(small?15000:28000,"shell"),shellMat);
const core=new THREE.Points(buildHeart(small?2500:4500,"core"),coreMat);
heartGroup.add(shell,core);

/* glow + rays */
const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:0xff4d7a,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:0}));
heartGroup.add(glow);
const rays=new THREE.Group();scene.add(rays);
const rayMats=[];
for(let i=0;i<16;i++){
  const len=3+Math.random()*4,w=0.05+Math.random()*0.14;
  const g=new THREE.PlaneGeometry(w,len);g.translate(0,len/2,0);
  const m=new THREE.MeshBasicMaterial({map:rayTex,color:i%3?0xff2e63:0xffc2d4,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:0,side:THREE.DoubleSide});
  const mesh=new THREE.Mesh(g,m);mesh.rotation.z=i/16*Math.PI*2+Math.random()*0.3;mesh.userData.spin=(Math.random()-0.5)*0.3;mesh.userData.ph=Math.random()*6.28;
  rayMats.push(mesh);rays.add(mesh);
}

/* holographic rings */
const rings=new THREE.Group();scene.add(rings);
function circle(r,seg,dash){
  const pts=[];for(let i=0;i<=seg;i++){const a=i/seg*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*r,0,Math.sin(a)*r));}
  const g=new THREE.BufferGeometry().setFromPoints(pts);
  const m=dash?new THREE.LineDashedMaterial({color:0xff2e63,dashSize:0.12,gapSize:0.1,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false})
             :new THREE.LineBasicMaterial({color:0xff5c86,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false});
  const l=new THREE.Line(g,m);if(dash)l.computeLineDistances();return l;
}
function ticks(r,n){const pts=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2,L=i%5?0.06:0.18;pts.push(new THREE.Vector3(Math.cos(a)*r,0,Math.sin(a)*r),new THREE.Vector3(Math.cos(a)*(r+L),0,Math.sin(a)*(r+L)));}
  return new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0xffb3c6,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));}
const ringA=circle(2.6,160,false),ringB=circle(3.05,200,true),ringC=ticks(3.35,120);
ringA.rotation.x=0.3;ringB.rotation.set(-0.5,0,0.25);ringC.rotation.x=0.28;
rings.add(ringA,ringB,ringC);

/* ambient dust + stars */
function cloud(n,rMin,rMax){const p=new Float32Array(n*3),s=new Float32Array(n);
  for(let i=0;i<n;i++){const r=rMin+Math.random()*(rMax-rMin),th=Math.random()*6.2831,ph=Math.acos(Math.random()*2-1);
    p[i*3]=r*Math.sin(ph)*Math.cos(th);p[i*3+1]=r*Math.cos(ph)*0.7;p[i*3+2]=r*Math.sin(ph)*Math.sin(th);s[i]=Math.random();}
  const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.BufferAttribute(p,3));g.setAttribute("aTone",new THREE.BufferAttribute(s,1));return g;}
const dustMat=new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
vertexShader:`uniform float uTime,uPR,uOpen;attribute float aTone;varying float vT;
void main(){vec3 p=position;float a=uTime*(0.02+aTone*0.03)*(1.0+uOpen*1.5);float c=cos(a),s=sin(a);p.xz=mat2(c,-s,s,c)*p.xz;p.y+=sin(uTime*0.5+aTone*20.0)*0.2;
vec4 mv=modelViewMatrix*vec4(p,1.0);gl_Position=projectionMatrix*mv;gl_PointSize=(1.0+aTone*2.5)*uPR*(10.0/-mv.z);vT=aTone;}`,
fragmentShader:`uniform float uTime;varying float vT;void main(){float d=length(gl_PointCoord-0.5);if(d>0.5)discard;float tw=0.5+0.5*sin(uTime*2.0+vT*50.0);
gl_FragColor=vec4(mix(vec3(1.0,0.2,0.4),vec3(1.0,0.9,0.95),vT),smoothstep(0.5,0.0,d)*(0.25+tw*0.5));}`});
scene.add(new THREE.Points(cloud(small?1500:3000,3.5,11),dustMat));
scene.add(new THREE.Points(cloud(small?1200:2400,40,90),dustMat));

/* floating heart sprites */
const FH=small?120:240;{
  const p=new Float32Array(FH*3),s=new Float32Array(FH);
  for(let i=0;i<FH;i++){p[i*3]=(Math.random()*2-1)*9;p[i*3+1]=Math.random()*16;p[i*3+2]=(Math.random()*2-1)*6-1;s[i]=Math.random();}
  const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.BufferAttribute(p,3));g.setAttribute("aTone",new THREE.BufferAttribute(s,1));
  const m=new THREE.ShaderMaterial({uniforms:Object.assign({uTex:{value:heartTex}},U),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  vertexShader:`uniform float uTime,uPR,uOpen,uSize;attribute float aTone;varying float vT;
  void main(){vec3 p=position;float sp=0.25+aTone*0.5;p.y=mod(p.y+uTime*sp*(1.0+uOpen*1.6),16.0)-8.0;p.x+=sin(uTime*0.7+aTone*30.0)*0.4;
  vec4 mv=modelViewMatrix*vec4(p,1.0);gl_Position=projectionMatrix*mv;gl_PointSize=(6.0+aTone*14.0)*uPR*(uSize/22.0)*(9.0/-mv.z);vT=aTone;}`,
  fragmentShader:`uniform sampler2D uTex;uniform float uOpen;varying float vT;void main(){vec4 t=texture2D(uTex,gl_PointCoord);
  gl_FragColor=vec4(mix(vec3(0.9,0.05,0.25),vec3(1.0,0.6,0.75),vT),t.a*(0.18+uOpen*0.35));}`});
  scene.add(new THREE.Points(g,m));
}

/* ---------- 3D word ring (HTML) ---------- */
const wordsEl=$("words");
const spans=LANGS.map((l,i)=>{const s=document.createElement("span");s.lang=l[0];s.dir="auto";s.innerHTML="";s.textContent=l[2];
  const sm=document.createElement("small");sm.textContent=l[1];s.appendChild(sm);
  s.addEventListener("click",e=>{e.stopPropagation();setHeadline(i,true);});wordsEl.appendChild(s);return s;});
const v3=new THREE.Vector3();let ringR=3.4;

/* ---------- headline with scramble ---------- */
const hlWord=$("hl-word"),hlMeta=$("hl-meta");
const GLYPH="01アイラブ♥ΣΔЖ爱사ح<>/{}#*";
let hlIndex=0,hlTimer=0,scr=null;
function setHeadline(i,manual){
  hlIndex=(i+N_LANG)%N_LANG;hlTimer=0;const [code,name,word]=LANGS[hlIndex];
  hlWord.lang=code;hlWord.dir=code==="ar"?"rtl":"ltr";
  hlMeta.innerHTML="<b>"+String(hlIndex+1).padStart(2,"0")+"</b> / 20 · "+name;
  if(reduce){hlWord.textContent=word;return;}
  const chars=Array.from(word);scr={chars,t:0,dur:0.7};
  if(manual) log(`<span class="k">&gt;</span> say(<span class="ok">"${code}"</span>)`);
}
function tickScramble(dt){
  if(!scr)return;scr.t+=dt;const p=Math.min(1,scr.t/scr.dur),n=scr.chars.length,rev=Math.floor(p*n);
  if(p>=1){hlWord.textContent=scr.chars.join("");scr=null;return;}
  let out="";for(let i=0;i<n;i++){out+=i<rev||scr.chars[i]===" "?scr.chars[i]:GLYPH[(Math.random()*GLYPH.length)|0];}
  hlWord.textContent=out;
}

/* ---------- terminal ---------- */
const term=$("term");const lines=[];let queue=[],typing=null;
function log(html){queue.push(html);}
function renderTerm(){const max=innerWidth<640?5:7;term.innerHTML="<div>"+lines.slice(-max).join("<br>")+(typing?"":"<br><span class='caret'></span>")+"</div>";}
function tickTerm(dt){
  if(!typing&&queue.length){typing={full:queue.shift(),i:0};lines.push("");}
  if(typing){
    const plain=typing.full;typing.i+=dt*(reduce?400:140);
    // reveal by visible characters, keeping tags intact
    let vis=0,out="",inTag=false,j=0;for(;j<plain.length;j++){const c=plain[j];if(c==="<")inTag=true;if(!inTag){if(vis>=typing.i)break;vis++;}out+=c;if(c===">")inTag=false;}
    if(j>=plain.length){lines[lines.length-1]=plain;typing=null;}else lines[lines.length-1]=out+"<span class='caret'></span>";
    renderTerm();
  }
}
renderTerm();
log(`<span class="k">&gt;</span> boot amor.core --render=webgl --bloom`);
log(`<span class="ok">[ok]</span> particle lattice: ${(shell.geometry.attributes.position.count+core.geometry.attributes.position.count).toLocaleString("en")} nodes`);
log(`<span class="ok">[ok]</span> cardiac oscillator locked @ 64 bpm`);
log(`<span class="k">&gt;</span> heart.assemble()`);

/* ---------- ECG ---------- */
const ecg=$("ecg"),eg=ecg.getContext("2d");const ecgBuf=new Array(170).fill(0);
function drawECG(){
  const w=ecg.clientWidth,h=ecg.clientHeight;if(ecg.width!==w*PR){ecg.width=w*PR;ecg.height=h*PR;}
  eg.setTransform(PR,0,0,PR,0,0);eg.clearRect(0,0,w,h);
  eg.strokeStyle="rgba(255,46,99,.18)";eg.lineWidth=1;for(let x=0;x<w;x+=10){eg.beginPath();eg.moveTo(x+.5,0);eg.lineTo(x+.5,h);eg.stroke();}
  eg.beginPath();const n=ecgBuf.length;for(let i=0;i<n;i++){const x=i/(n-1)*w,y=h*0.62-ecgBuf[i]*h*0.5;i?eg.lineTo(x,y):eg.moveTo(x,y);}
  eg.strokeStyle="#ff2e63";eg.lineWidth=1.6;eg.shadowColor="#ff2e63";eg.shadowBlur=8;eg.stroke();eg.shadowBlur=0;
}

/* ---------- code rain ---------- */
const rain=$("rain"),rg=rain.getContext("2d");let cols=[],fs=14,rainAcc=0;
const RAIN="01♥<>{}[]=;:/ABCDEFアイシテルラブ爱사랑αγάπη";
function sizeRain(){rain.width=innerWidth;rain.height=innerHeight;fs=innerWidth<640?12:15;cols=Array.from({length:Math.ceil(innerWidth/fs)},()=>Math.random()*-60);rg.fillStyle="#06010b";rg.fillRect(0,0,rain.width,rain.height);}
function tickRain(dt,open){
  if(reduce)return;rainAcc+=dt;if(rainAcc<1/30)return;rainAcc=0;
  rg.fillStyle="rgba(6,1,11,0.14)";rg.fillRect(0,0,rain.width,rain.height);rg.font=fs+"px JetBrains Mono, monospace";
  for(let i=0;i<cols.length;i++){if(Math.random()>0.55+open*0.35)continue;const y=cols[i]*fs;const ch=RAIN[(Math.random()*RAIN.length)|0];
    rg.fillStyle=Math.random()<0.06?"#ffe3ea":(ch==="♥"?"#ff2e63":"#7a0a2a");rg.fillText(ch,i*fs,y);
    cols[i]++;if(y>rain.height&&Math.random()>0.975)cols[i]=Math.random()*-20;}
}

/* ---------- audio heartbeat ---------- */
let actx=null,soundOn=false;
function thump(strength){if(!soundOn||!actx)return;const t=actx.currentTime;const o=actx.createOscillator(),g=actx.createGain(),f=actx.createBiquadFilter();
  o.type="sine";o.frequency.setValueAtTime(72,t);o.frequency.exponentialRampToValueAtTime(34,t+0.16);f.type="lowpass";f.frequency.value=180;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.7*strength,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+0.24);
  o.connect(f);f.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+0.26);}
$("sound").addEventListener("click",()=>{
  try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume();}catch(e){}
  soundOn=!soundOn&&!!actx;$("sound").textContent=soundOn?"Sound on":"Sound off";
});

/* ---------- open / close ---------- */
let openTarget=0,open=0,autoOpened=false;
const toggleBtn=$("toggle");
function setOpen(v){
  openTarget=v?1:0;autoOpened=true;toggleBtn.textContent=v?"Close heart":"Open heart";
  if(v){log(`<span class="k">&gt;</span> heart.open()`);log(`<span class="ok">[..]</span> decrypting 20 languages`);
    LANGS.forEach((l,i)=>log(`<span class="ok">[${String(i+1).padStart(2,"0")}/20]</span> ${l[0].padEnd(3," ")} <span class="ok">${l[2]}</span>`));
    log(`<span class="ok">[ok]</span> love broadcast on all channels ♥`);setHeadline(0,false);}
  else{log(`<span class="k">&gt;</span> heart.close()`);log(`<span class="ok">[ok]</span> sealed · tap to reopen`);}
}
toggleBtn.addEventListener("click",()=>setOpen(!openTarget));
addEventListener("keydown",e=>{if(e.code==="Space"&&e.target===document.body){e.preventDefault();setOpen(!openTarget);}
  if(openTarget&&(e.key==="ArrowRight"||e.key==="ArrowLeft"))setHeadline(hlIndex+(e.key==="ArrowRight"?1:-1),true);});
let down=null;
canvas.addEventListener("pointerdown",e=>{down={x:e.clientX,y:e.clientY,t:performance.now()};});
canvas.addEventListener("pointerup",e=>{if(!down)return;const d=Math.hypot(e.clientX-down.x,e.clientY-down.y);if(d<6&&performance.now()-down.t<400)setOpen(!openTarget);down=null;});

/* ---------- resize ---------- */
function resize(){
  const w=innerWidth,h=innerHeight,asp=w/h;renderer.setSize(w,h,false);composer&&composer.setSize(w,h);
  camera.aspect=asp;camera.updateProjectionMatrix();
  ringR=asp<1?2.55:3.4;
  const fit=Math.max(9,(2*ringR+1.4)/(2*Math.tan(THREE.MathUtils.degToRad(22.5))*asp));
  camera.position.setLength(fit);
  if(controls){controls.minDistance=fit*0.55;controls.maxDistance=fit*1.8;}
  U.uSize.value=22*(h/900)*(fit/9);
  sizeRain();
}
addEventListener("resize",resize);resize();

/* ---------- loop ---------- */
const clock=new THREE.Clock();let phase=0,lastPh=0,elapsed=0;
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
function beatShape(p){return Math.exp(-Math.pow((p-0.06)/0.035,2))+0.55*Math.exp(-Math.pow((p-0.24)/0.045,2));}
function frame(){
  const dt=Math.min(clock.getDelta(),0.05);elapsed+=dt;const speed=reduce?0.4:1;
  U.uTime.value+=dt*speed;
  // assembly intro
  U.uScatter.value=Math.max(0,1-ease(Math.min(1,elapsed/3.2)));
  if(!autoOpened&&elapsed>4.4){setOpen(true);}
  // open easing
  open+=(openTarget-open)*Math.min(1,dt*(reduce?3:1.5));U.uOpen.value=open;
  U.uCore.value=ease(Math.min(1,Math.max(0,(open-0.15)/0.85)));
  // heartbeat
  const bpm=64+26*open;phase+=dt*bpm/60;const p=phase%1;const b=beatShape(p);U.uBeat.value=b*(reduce?0.4:1);
  if(Math.floor(phase)!==Math.floor(lastPh))thump(1);if(lastPh%1<0.22&&p>=0.22)thump(0.55);lastPh=phase;
  ecgBuf.push(b*(0.6+open*0.4)+(Math.random()-.5)*0.04);ecgBuf.shift();
  $("bpm").firstChild.nodeValue=String(Math.round(bpm+b*3)).padStart(3,"0");
  // heart sway
  heartGroup.rotation.y=Math.sin(U.uTime.value*0.35)*0.32*(1-open*0.6);
  heartGroup.rotation.x=Math.sin(U.uTime.value*0.27)*0.06;
  glow.material.opacity=0.15+open*0.75+b*0.25;const gs=1.4+open*3.2+b*0.6;glow.scale.set(gs,gs,1);
  rays.quaternion.copy(camera.quaternion);rays.rotation.z+=dt*0.08*speed;
  rayMats.forEach((r,i)=>{r.material.opacity=open*(0.18+0.22*Math.sin(U.uTime.value*1.3+r.userData.ph))*(0.7+b*0.5);r.scale.y=0.3+open*0.9;});
  const rs=0.4+ease(open)*0.6;rings.scale.set(rs,rs,rs);
  ringA.rotation.y+=dt*0.25*speed;ringB.rotation.y-=dt*0.18*speed;ringC.rotation.y+=dt*0.1*speed;
  ringA.material.opacity=open*0.45;ringB.material.opacity=open*0.6;ringC.material.opacity=open*0.5;
  if(bloom)bloom.strength=1.0+open*0.45+b*0.35;
  // word ring
  const wo=ease(Math.min(1,Math.max(0,(open-0.25)/0.75)));const H=innerHeight,W=innerWidth;
  const baseFont=Math.max(11,Math.min(20,W/64));
  for(let i=0;i<N_LANG;i++){
    const a=i/N_LANG*Math.PI*2+U.uTime.value*0.12;const R=ringR*wo;
    v3.set(Math.cos(a)*R,Math.sin(a*2+U.uTime.value*0.6)*0.35*wo,Math.sin(a)*R);
    v3.applyAxisAngle(new THREE.Vector3(1,0,0),0.28);
    const front=(v3.z/ringR+1)/2;
    const dist=camera.position.distanceTo(v3);
    v3.project(camera);
    const x=(v3.x*0.5+0.5)*W,y=(-v3.y*0.5+0.5)*H;
    const s=(camera.position.length()/dist)*(0.55+front*0.45);
    const sp=spans[i];
    sp.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-50%) scale(${s.toFixed(3)})`;
    sp.style.fontSize=baseFont+"px";
    sp.style.opacity=(wo*(0.18+0.82*front*front)*(i===hlIndex?1:0.85)).toFixed(3);
    sp.style.zIndex=String(Math.round(front*100));
    sp.style.pointerEvents=wo>0.5?"auto":"none";
  }
  // headline
  hlWord.style.opacity=hlMeta.style.opacity=String(wo);
  if(openTarget&&wo>0.6){hlTimer+=dt;if(hlTimer>2.4)setHeadline(hlIndex+1,false);}
  tickScramble(dt);tickTerm(dt);tickRain(dt,open);drawECG();
  if(controls)controls.update();
  composer?composer.render():renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
