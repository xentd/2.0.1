<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0">
<title>Heart of Twenty Tongues</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500&family=Noto+Sans:wght@500;700&family=Syncopate:wght@400;700&display=swap">
<style>
/* Layout: full-bleed WebGL stage with custom post-FX; HUD pinned to the four corners; boot overlay on load */
:root{
  --void:#06010b;
  --blood:#9e0029;
  --rose:#ff2e63;
  --blush:#ff9fb8;
  --plasma:#fff0f4;
  --dim:rgba(255,159,184,.6);
  --hair:rgba(255,46,99,.32);
  --display:"Syncopate","Arial Black",Impact,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --word:"Noto Sans",system-ui,"Segoe UI","Hiragino Sans","Apple SD Gothic Neo","Noto Sans CJK SC","Noto Sans Devanagari","Noto Sans Arabic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--plasma);overflow:hidden;font-family:var(--mono);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#rain{position:fixed;inset:0;width:100%;height:100%;mix-blend-mode:screen;opacity:.38;pointer-events:none}

#words{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#words span{position:absolute;left:0;top:0;white-space:nowrap;font-family:var(--word);font-weight:700;color:var(--plasma);
  text-shadow:0 0 6px var(--rose),0 0 18px rgba(255,46,99,.8),0 0 42px rgba(158,0,41,.9);pointer-events:auto;cursor:pointer;will-change:transform,opacity}
#words span small{display:block;font-family:var(--mono);font-weight:300;font-size:.42em;letter-spacing:.22em;color:var(--blush);text-shadow:none;text-align:center;margin-top:.2em;opacity:.8}

#caption{position:fixed;left:0;top:0;text-align:center;pointer-events:none;width:min(92vw,700px);will-change:transform}
#cap-word{font-family:var(--word);font-weight:500;font-size:clamp(13px,1.6vw,18px);letter-spacing:.04em;color:#fff;text-shadow:0 0 10px var(--rose)}
#cap-meta{margin-top:.5em;font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--blush)}
#cap-meta b{color:#fff;font-weight:500}

.hud{position:fixed;font-size:11px;letter-spacing:.08em;color:var(--dim);pointer-events:none}
#tl{top:calc(18px + env(safe-area-inset-top,0px));left:calc(18px + env(safe-area-inset-left,0px))}
#tl h1{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.42em;color:var(--plasma);margin:0 0 6px;text-shadow:0 0 12px var(--rose)}
#tl p{margin:0;letter-spacing:.24em;text-transform:uppercase;font-size:10px}
#tr{top:calc(18px + env(safe-area-inset-top,0px));right:calc(18px + env(safe-area-inset-right,0px));text-align:right}
#bpm{font-family:var(--display);font-size:22px;color:#fff;letter-spacing:.06em;text-shadow:0 0 14px var(--rose);font-variant-numeric:tabular-nums}
#bpm small{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--blush);margin-left:6px}
#ecg{display:block;width:170px;height:46px;margin-top:6px;margin-left:auto;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
#tele{margin-top:10px;display:grid;grid-template-columns:auto auto;gap:3px 14px;justify-content:end;font-size:10px;letter-spacing:.18em;font-variant-numeric:tabular-nums}
#tele dt{text-transform:uppercase;opacity:.75}
#tele dd{margin:0;color:#fff;min-width:7ch;text-align:right}
.bar{display:inline-block;width:60px;height:4px;background:var(--hair);vertical-align:middle;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--rose);box-shadow:0 0 8px var(--rose)}
#bl{left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(430px,calc(100vw - 36px))}
#term{font-size:11px;line-height:1.65;color:var(--blush);white-space:pre;overflow:hidden;height:calc(1.65em * 7);display:flex;flex-direction:column;justify-content:flex-end;
  border-left:1px solid var(--hair);padding-left:10px;font-variant-numeric:tabular-nums}
#term .ok{color:#fff}
#term .k{color:var(--rose)}
.caret{display:inline-block;width:.6em;height:1em;background:var(--rose);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#br{right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));pointer-events:auto;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#br .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
button{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--plasma);background:rgba(158,0,41,.18);
  border:1px solid var(--hair);padding:10px 14px;cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:background .25s,border-color .25s,box-shadow .25s}
button:hover{background:rgba(255,46,99,.28);border-color:var(--rose);box-shadow:0 0 18px rgba(255,46,99,.45)}
button:focus-visible{outline:1px solid #fff;outline-offset:3px}
button.primary{border-color:var(--rose);background:rgba(255,46,99,.22)}
button.nova{border-color:#fff;color:#fff;box-shadow:0 0 14px rgba(255,46,99,.35) inset}
#hint{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}

#boot{position:fixed;inset:0;background:var(--void);display:grid;place-items:center;z-index:50;transition:opacity .8s,filter .8s}
#boot.gone{opacity:0;filter:blur(12px);pointer-events:none}
#boot .in{width:min(420px,calc(100vw - 48px));font-size:11px;letter-spacing:.14em;color:var(--blush);line-height:1.8}
#boot h2{font-family:var(--display);font-size:clamp(16px,4vw,22px);letter-spacing:.4em;color:#fff;margin:0 0 18px;text-shadow:0 0 16px var(--rose),2px 0 0 rgba(0,255,255,.35),-2px 0 0 rgba(255,0,80,.5)}
#boot .track{height:2px;background:var(--hair);margin-top:16px;position:relative}
#boot .track i{position:absolute;inset:0 auto 0 0;width:0;background:var(--rose);box-shadow:0 0 12px var(--rose)}
#boot .pct{display:flex;justify-content:space-between;margin-top:8px;font-variant-numeric:tabular-nums;color:#fff}

@media (max-width:640px){
  #bl{bottom:calc(128px + env(safe-area-inset-bottom,0px))}
  #term{font-size:10px;height:calc(1.65em * 4)}
  #br{left:calc(18px + env(safe-area-inset-left,0px));align-items:stretch}
  #br .row button{flex:1;padding:10px 6px;letter-spacing:.14em}
  #hint{display:none}
  #ecg{width:110px;height:34px}
  #tele{display:none}
  #tl h1{font-size:11px;letter-spacing:.3em}
}
#fail[hidden]{display:none}
#fail{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font-size:13px;color:var(--blush);z-index:60;background:var(--void)}
</style>

<canvas id="stage" aria-label="A 3D particle heart that opens to reveal 'I love you' in 20 languages"></canvas>

</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function(){
"use strict";
const LANGS=[
  ["en","English","I love you"],["es","Español","Te amo"],["fr","Français","Je t’aime"],["de","Deutsch","Ich liebe dich"],
  ["it","Italiano","Ti amo"],["pt","Português","Eu te amo"],["ru","Русский","Я тебя люблю"],["ja","日本語","愛してる"],
  ["zh","中文","我爱你"],["ko","한국어","사랑해"],["ar","العربية","أحبك"],["hi","हिन्दी","मुझे तुमसे प्यार है"],
  ["tr","Türkçe","Seni seviyorum"],["nl","Nederlands","Ik hou van jou"],["el","Ελληνικά","Σ’ αγαπώ"],["sv","Svenska","Jag älskar dig"],
  ["pl","Polski","Kocham cię"],["id","Bahasa Indonesia","Aku cinta kamu"],["sw","Kiswahili","Nakupenda"],["tl","Tagalog","Mahal kita"]
];
const NL=LANGS.length;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const small=Math.min(innerWidth,innerHeight)<600;
const $=id=>document.getElementById(id);
const fail=()=>{$("fail").hidden=false;$("boot").classList.add("gone");};
if(typeof THREE==="undefined"){fail();return;}

/* ================= renderer / post ================= */
const canvas=$("stage");let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:"high-performance"});}catch(e){fail();return;}
const PR=Math.min(devicePixelRatio||1,small?1.75:2);
renderer.setPixelRatio(PR);renderer.setClearColor(0x06010b,1);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,1,0.1,300);camera.position.set(0,0.3,9);scene.add(camera);
let controls=null;
if(THREE.OrbitControls){controls=new THREE.OrbitControls(camera,canvas);controls.enableDamping=true;controls.dampingFactor=0.06;controls.enablePan=false;controls.rotateSpeed=0.6;controls.zoomSpeed=0.6;}

let composer=null,bloom=null,finalPass=null;
const FX={tDiffuse:{value:null},uTime:{value:0},uAberr:{value:0.004},uGlitch:{value:0},uFlash:{value:0},uRes:{value:new THREE.Vector2(1,1)}};
if(THREE.EffectComposer&&THREE.UnrealBloomPass&&THREE.ShaderPass){
  composer=new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene,camera));
  bloom=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.15,0.6,0.08);composer.addPass(bloom);
  finalPass=new THREE.ShaderPass({uniforms:FX,
    vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`uniform sampler2D tDiffuse;uniform float uTime,uAberr,uGlitch,uFlash;uniform vec2 uRes;varying vec2 vUv;
    float h(float n){return fract(sin(n)*43758.5453);}
    void main(){vec2 uv=vUv;
      if(uGlitch>0.001){float band=floor(uv.y*28.0)+floor(uTime*24.0)*7.0;float r=h(band);if(r<uGlitch*0.55)uv.x+=(h(band+1.3)-0.5)*0.18*uGlitch;}
      vec2 d=uv-0.5;float L=length(d);float ab=uAberr*(0.3+L*1.8)+uGlitch*0.012;
      vec3 c=vec3(texture2D(tDiffuse,uv+d*ab).r,texture2D(tDiffuse,uv).g,texture2D(tDiffuse,uv-d*ab).b);
      float n=h(dot(floor(uv*uRes),vec2(12.9898,78.233))+fract(uTime*7.0)*100.0);
      c+=(n-0.5)*0.045;
      c*=0.95+0.05*sin(uv.y*uRes.y*1.6);
      c*=1.0-smoothstep(0.28,1.1,L);
      c+=uFlash*vec3(1.0,0.82,0.88);
      gl_FragColor=vec4(c,1.0);}`});
  composer.addPass(finalPass);
}

/* ================= textures ================= */
function canvasTex(w,h,draw){const c=document.createElement("canvas");c.width=w;c.height=h;draw(c.getContext("2d"),w,h);return new THREE.CanvasTexture(c);}
const glowTex=canvasTex(256,256,(g,w)=>{const r=g.createRadialGradient(w/2,w/2,0,w/2,w/2,w/2);
  r.addColorStop(0,"rgba(255,255,255,1)");r.addColorStop(.12,"rgba(255,190,210,.9)");r.addColorStop(.35,"rgba(255,46,99,.35)");r.addColorStop(1,"rgba(255,0,60,0)");g.fillStyle=r;g.fillRect(0,0,w,w);});
const rayTex=canvasTex(64,256,(g,w,h)=>{const a=g.createLinearGradient(0,0,w,0);a.addColorStop(0,"rgba(255,255,255,0)");a.addColorStop(.5,"rgba(255,255,255,1)");a.addColorStop(1,"rgba(255,255,255,0)");
  g.fillStyle=a;g.fillRect(0,0,w,h);g.globalCompositeOperation="destination-in";const b=g.createLinearGradient(0,h,0,0);b.addColorStop(0,"rgba(0,0,0,1)");b.addColorStop(1,"rgba(0,0,0,0)");g.fillStyle=b;g.fillRect(0,0,w,h);});
const heartTex=canvasTex(64,64,(g)=>{g.translate(32,34);g.scale(1.7,1.7);g.beginPath();
  for(let i=0;i<=60;i++){const t=i/60*Math.PI*2,s=Math.sin(t);const x=s*s*s*10,y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/1.6;i?g.lineTo(x,y):g.moveTo(x,y);}
  g.closePath();g.shadowColor="#fff";g.shadowBlur=6;g.fillStyle="#fff";g.fill();});

/* ================= shared uniforms ================= */
const U={uTime:{value:0},uOpen:{value:0},uBeat:{value:0},uScatter:{value:1},uPR:{value:PR},uSize:{value:22},uCore:{value:0},
  uMouse:{value:new THREE.Vector3(99,99,99)},uMouseOn:{value:0},uShock:{value:9},uNova:{value:0},uWarp:{value:0.06}};

/* ================= heart shell ================= */
function heartXY(t){const s=Math.sin(t);return[s*s*s*1.6,(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)+2.5)*0.1];}
const DEPTH=0.78;
function buildHeart(n,mode){
  const pos=new Float32Array(n*3),side=new Float32Array(n),rnd=new Float32Array(n*3),size=new Float32Array(n),tone=new Float32Array(n);
  for(let i=0;i<n;i++){
    const t=Math.random()*Math.PI*2,[hx,hy]=heartXY(t),r=Math.random();let k,z;
    if(mode==="core"){k=Math.cbrt(Math.random());z=(Math.random()*2-1)*DEPTH*Math.sqrt(Math.max(0,1-k*k));}
    else if(r<0.26){k=1+(Math.random()-0.5)*0.025;z=(Math.random()-0.5)*0.1;}
    else if(r<0.92){k=Math.sqrt(Math.random());z=(Math.random()<0.5?-1:1)*DEPTH*Math.sqrt(Math.max(0,1-k*k))+(Math.random()-0.5)*0.035;}
    else{k=Math.random();z=(Math.random()*2-1)*DEPTH*Math.sqrt(1-k*k)*0.85;}
    const x=hx*k,y=hy*k;pos.set([x,y,z],i*3);side[i]=x<0?-1:1;
    rnd.set([Math.random()*2-1,Math.random()*2-1,Math.random()*2-1],i*3);
    size[i]=0.55+Math.pow(Math.random(),3)*1.4;tone[i]=Math.random();
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.BufferAttribute(pos,3));g.setAttribute("aSide",new THREE.BufferAttribute(side,1));
  g.setAttribute("aRnd",new THREE.BufferAttribute(rnd,3));g.setAttribute("aSize",new THREE.BufferAttribute(size,1));g.setAttribute("aTone",new THREE.BufferAttribute(tone,1));
  return g;
}
const SOFT_FRAG=`varying vec3 vCol;varying float vA;void main(){vec2 c=gl_PointCoord-0.5;float d=length(c);if(d>0.5)discard;float a=smoothstep(0.5,0.0,d);a*=a;gl_FragColor=vec4(vCol,a*vA);}`;
const GLSL_COMMON=`
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
vec3 repel(vec3 p,vec3 m,float on){vec3 d=p-m;float l=length(d);return p+(d/(l+1e-4))*on*0.65*exp(-l*l*2.2);}
`;
const shellMat=new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
vertexShader:`
uniform float uTime,uOpen,uBeat,uScatter,uPR,uSize,uMouseOn,uShock,uNova;uniform vec3 uMouse;
attribute float aSide,aSize,aTone;attribute vec3 aRnd;varying vec3 vCol;varying float vA;
${GLSL_COMMON}
void main(){
  vec3 p=position;
  float seam=smoothstep(0.16,0.0,abs(p.x));
  float sc=clamp(uScatter*1.45-aTone*0.45,0.0,1.0);sc=sc*sc*(3.0-2.0*sc);
  vec3 far=aRnd*vec3(10.0,6.5,7.0);far.xz=rot(sc*5.0+aTone*6.2831)*far.xz;
  p=mix(p,far,sc);
  p*=1.0+uBeat*0.075*(1.0-uOpen*0.5);
  p+=0.018*sin(uTime*2.2+aRnd*31.0);
  float o=uOpen;vec3 piv=vec3(0.0,0.0,-0.5);
  p-=piv;p.xz=rot(o*1.05*aSide)*p.xz;p+=piv;
  p.x+=aSide*o*1.05;p.y+=o*0.12;
  p+=aRnd*sin(o*3.14159)*0.5;
  float r=length(p);float wf=uShock*5.5;float sh=exp(-pow(r-wf,2.0)*5.0)*max(0.0,1.0-uShock*0.6);
  p+=(p/(r+1e-4))*sh*0.45;
  float nv=clamp(uNova*1.35-aTone*0.35,0.0,1.0);nv=sin(nv*3.14159);nv*=nv;
  vec3 dir=normalize(aRnd+1e-3);dir.xz=rot(nv*2.0)*dir.xz;
  p+=dir*nv*(5.0+aTone*9.0);
  p=repel(p,uMouse,uMouseOn);
  vec4 mv=modelViewMatrix*vec4(p,1.0);gl_Position=projectionMatrix*mv;
  gl_PointSize=uSize*aSize*uPR*(1.0+uBeat*0.25+nv*0.8)/(-mv.z);
  vec3 deep=vec3(0.5,0.0,0.08),hot=vec3(1.0,0.1,0.32),white=vec3(1.0,0.86,0.92);
  vec3 c=mix(deep,hot,aTone);c=mix(c,white,pow(aTone,9.0));
  c+=white*seam*o*1.4+white*sh*1.5+vec3(1.0,0.5,0.7)*nv*1.2;
  c*=(0.7+uBeat*0.65+sc*0.6)*(1.0-0.5*o*(1.0-nv));
  vCol=c;vA=0.8;
}`,fragmentShader:SOFT_FRAG});
const coreMat=new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
vertexShader:`uniform float uTime,uBeat,uPR,uSize,uCore,uNova;attribute float aSize,aTone;attribute vec3 aRnd;varying vec3 vCol;varying float vA;
void main(){vec3 p=position*(0.42+uBeat*0.06)*uCore;float a=uTime*0.6+aTone*6.2831;p+=vec3(cos(a),sin(a*1.3),sin(a))*0.05*uCore;p+=aRnd*(1.0-uCore)*0.2;
float nv=sin(clamp(uNova,0.0,1.0)*3.14159);p*=1.0+nv*0.8;
vec4 mv=modelViewMatrix*vec4(p,1.0);gl_Position=projectionMatrix*mv;gl_PointSize=uSize*aSize*uPR*1.1/(-mv.z);
vCol=mix(vec3(1.0,0.35,0.55),vec3(1.0,0.95,0.97),aTone)*(0.22+uBeat*0.4)*uCore;vA=1.0;}`,fragmentShader:SOFT_FRAG});

const heartGroup=new THREE.Group();scene.add(heartGroup);
const shell=new THREE.Points(buildHeart(small?15000:30000,"shell"),shellMat);
const core=new THREE.Points(buildHeart(small?2500:4500,"core"),coreMat);
shell.frustumCulled=core.frustumCulled=false;
heartGroup.add(shell,core);

/* glow + rays */
const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:0xff4d7a,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:0}));
heartGroup.add(glow);

  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(1.0,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+1.6);o.connect(g);g.connect(master);o.start(t);o.stop(t+1.7);whoosh(2.2,false);}
const PENTA=[0,2,4,7,9];
function blip(i){if(!soundOn)return;const t=actx.currentTime;const n=PENTA[i%5]+12*Math.floor((i%10)/5);const f=880*Math.pow(2,n/12);
  const o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.09,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+0.9);
  o.connect(g);g.connect(master);g.connect(master.userData.delay);o.start(t);o.stop(t+1);}
$("sound").addEventListener("click",()=>{
  try{if(!actx)initAudio();actx.resume&&actx.resume();}catch(e){actx=null;}
  soundOn=!soundOn&&!!actx;if(actx)master.gain.setTargetAtTime(soundOn?0.9:0,actx.currentTime,0.1);
  $("sound").textContent=soundOn?"Sound on":"Sound off";if(soundOn)log(`<span class="ok">[ok]</span> audio synth online`);
});

/* ================= events / FX triggers ================= */
let glitchV=0,flashV=0,shakeV=0,warpV=0.06,novaT=-1;
function glitch(v){if(!reduce)glitchV=Math.max(glitchV,v);}
function shock(power){U.uShock.value=0;shakeV=Math.max(shakeV,0.12*power);glitch(0.4*power);}

let openTarget=0,open=0,autoOpened=false;const toggleBtn=$("toggle");
function setOpen(v){
  openTarget=v?1:0;autoOpened=true;toggleBtn.textContent=v?"Close heart":"Open heart";shock(1);
  if(v){warpV=1;flashV=0.35;whoosh(1.4,true);
    log(`<span class="k">&gt;</span> heart.open()`);log(`<span class="ok">[..]</span> spinning up hyperdrive · arc discharge`);
    LANGS.forEach((l,i)=>log(`<span class="ok">[${String(i+1).padStart(2,"0")}/20]</span> ${l[0].padEnd(3," ")} <span class="ok">${l[2]}</span>`));
    log(`<span class="ok">[ok]</span> love broadcast on all channels ♥`);setLang(0,false);}
  else{whoosh(1,false);log(`<span class="k">&gt;</span> heart.close()`);log(`<span class="ok">[ok]</span> sealed · tap to reopen`);}
}
function supernova(){if(novaT>=0)return;novaT=0;flashV=0.9;shakeV=0.35;glitch(1);warpV=1;boom();
  log(`<span class="k">&gt;</span> heart.supernova()`);log(`<span class="ok">[!!]</span> containment released · 0.4 ms`);log(`<span class="ok">[ok]</span> reassembling from stardust`);}
toggleBtn.addEventListener("click",()=>setOpen(!openTarget));
$("nova").addEventListener("click",supernova);
addEventListener("keydown",e=>{if(e.target.tagName==="BUTTON"&&(e.code==="Space"||e.key==="Enter"))return;
  if(e.code==="Space"){e.preventDefault();setOpen(!openTarget);}
  if(e.key==="n"||e.key==="N")supernova();
  if(openTarget&&(e.key==="ArrowRight"||e.key==="ArrowLeft"))setLang(li+(e.key==="ArrowRight"?1:-1),true);});

/* pointer: repel field + tap */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),plane=new THREE.Plane(),hit=new THREE.Vector3(),camDir=new THREE.Vector3();
let mouseTarget=0,down=null;
function updateMouse(e){ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,camera);
  camera.getWorldDirection(camDir);plane.setFromNormalAndCoplanarPoint(camDir,new THREE.Vector3(0,0,0.4));
  if(ray.ray.intersectPlane(plane,hit)){U.uMouse.value.copy(heartGroup.worldToLocal(hit.clone()));TU.uMouseT.value.copy(hit).sub(textPts.position);mouseTarget=1;}}
canvas.addEventListener("pointermove",updateMouse);
canvas.addEventListener("pointerleave",()=>{mouseTarget=0;});
canvas.addEventListener("pointerdown",e=>{down={x:e.clientX,y:e.clientY,t:performance.now()};updateMouse(e);});
canvas.addEventListener("pointerup",e=>{if(!down)return;const d=Math.hypot(e.clientX-down.x,e.clientY-down.y);if(d<6&&performance.now()-down.t<400)setOpen(!openTarget);down=null;if(e.pointerType!=="mouse")mouseTarget=0;});

/* ================= resize ================= */
function resize(){
  const w=innerWidth,h=innerHeight,asp=w/h;renderer.setSize(w,h,false);
  if(composer){composer.setSize(w,h);FX.uRes.value.set(w*PR,h*PR);}
  camera.aspect=asp;camera.updateProjectionMatrix();
  ringR=asp<1?2.55:3.4;
  const fit=Math.max(9,(2*ringR+1.4)/(2*Math.tan(THREE.MathUtils.degToRad(22.5))*asp));
  camera.position.setLength(fit);if(controls){controls.minDistance=fit*0.5;controls.maxDistance=fit*1.8;}
  U.uSize.value=22*(h/900)*(fit/9);
  const nw=asp<1?2.7:4.4;if(nw!==textWidthWorld){textWidthWorld=nw;if(openTarget){morphTo(sampleText(LANGS[li][2],LANGS[li][0]==="ar"));morphT=1;}}
  sizeRain();
}
addEventListener("resize",resize);resize();

/* ================= boot sequence ================= */
const BOOT=["mounting cardiac engine","compiling 4 shader programs","allocating "+NODES.toLocaleString("en")+" particles","tuning bloom + chromatic optics","loading 20 language packs","calibrating love"];
let bootDone=false;
function tickBoot(t){if(bootDone)return;const p=Math.min(1,t/2.0);$("boot-bar").style.width=(p*100)+"%";$("boot-pct").textContent=String(Math.floor(p*100)).padStart(3,"0")+"%";
  const s=BOOT[Math.min(BOOT.length-1,Math.floor(p*BOOT.length))];$("boot-step").textContent=s;$("boot-log").textContent="> "+s;
  if(p>=1){bootDone=true;$("boot").classList.add("gone");glitch(0.6);
    log(`<span class="k">&gt;</span> boot amor.core v3 --webgl --bloom --chroma`);
    log(`<span class="ok">[ok]</span> lattice: ${NODES.toLocaleString("en")} nodes online`);
    log(`<span class="ok">[ok]</span> cardiac oscillator locked @ 64 bpm`);
    log(`<span class="k">&gt;</span> heart.assemble()`);}}

/* ================= loop ================= */
const clock=new THREE.Clock();let phase=0,lastPh=0,elapsed=0,arcAcc=0,fpsAcc=0,fpsN=0;const shakeOff=new THREE.Vector3();
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const beatShape=p=>Math.exp(-Math.pow((p-0.06)/0.035,2))+0.55*Math.exp(-Math.pow((p-0.24)/0.045,2));
function frame(){
  const dt=Math.min(clock.getDelta(),0.05);elapsed+=dt;const speed=reduce?0.4:1;
  U.uTime.value+=dt*speed;FX.uTime.value=U.uTime.value;
  tickBoot(elapsed);
  const asm=Math.max(0,elapsed-2.0);
  U.uScatter.value=Math.max(0,1-ease(Math.min(1,asm/3.2)));
  if(!autoOpened&&asm>4.6)setOpen(true);
  // open
  open+=(openTarget-open)*Math.min(1,dt*(reduce?3:1.5));U.uOpen.value=open;
  U.uCore.value=ease(Math.min(1,Math.max(0,(open-0.15)/0.85)));
  // nova
  if(novaT>=0){novaT+=dt/3.6;U.uNova.value=Math.min(1,novaT);if(novaT>=1){novaT=-1;U.uNova.value=0;shock(0.8);}}
  const novaEnv=novaT>=0?Math.sin(Math.min(1,novaT)*Math.PI):0;
  // heartbeat
  const bpm=64+26*open+novaEnv*60;phase+=dt*bpm/60;const p=phase%1;const b=beatShape(p)*(reduce?0.4:1);U.uBeat.value=b;
  if(Math.floor(phase)!==Math.floor(lastPh))thump(1);if(lastPh%1<0.22&&p>=0.22)thump(0.55);lastPh=phase;
  ecgBuf.push(b*(0.6+open*0.4)+(Math.random()-.5)*(0.04+novaEnv*0.4));ecgBuf.shift();
  $("bpm").firstChild.nodeValue=String(Math.round(bpm+b*3)).padStart(3,"0");
  // decays
  U.uShock.value+=dt*0.9;glitchV=Math.max(0,glitchV-dt*1.6);flashV=Math.max(0,flashV-dt*1.4);shakeV=Math.max(0,shakeV-dt*0.5);
  warpV+=((0.06+novaEnv*0.8)-warpV)*Math.min(1,dt*0.9);U.uWarp.value=reduce?0.03:warpV;
  U.uMouseOn.value+=(mouseTarget*(reduce?0:1)-U.uMouseOn.value)*Math.min(1,dt*6);
  FX.uGlitch.value=glitchV+novaEnv*0.25;FX.uFlash.value=flashV;FX.uAberr.value=0.0035+b*0.004+novaEnv*0.02+glitchV*0.01;
  // heart motion
  heartGroup.rotation.y=Math.sin(U.uTime.value*0.35)*0.32*(1-open*0.6);heartGroup.rotation.x=Math.sin(U.uTime.value*0.27)*0.06;
  glow.material.opacity=0.15+open*0.22+b*0.15+novaEnv;const gs=1.4+open*2.2+b*0.5+novaEnv*8;glow.scale.set(gs,gs,1);
  rays.quaternion.copy(camera.quaternion);shockMesh.quaternion.copy(camera.quaternion);
  rayMeshes.forEach(r=>{r.material.opacity=Math.max(open,novaEnv)*(0.16+0.2*Math.sin(U.uTime.value*1.3+r.userData.ph))*(0.7+b*0.5);r.scale.y=0.3+open*0.9+novaEnv*2;});
  const rs=0.4+ease(open)*0.6+novaEnv*0.6;rings.scale.set(rs,rs,rs);
  ringA.rotation.y+=dt*0.25*speed;ringB.rotation.y-=dt*0.18*speed;ringC.rotation.y+=dt*0.1*speed;ringD.rotation.y-=dt*0.06*speed;
  ringA.material.opacity=open*0.45;ringB.material.opacity=open*0.6;ringC.material.opacity=open*0.5;ringD.material.opacity=open*0.3;
  arcAcc+=dt;if(arcAcc>(reduce?0.3:0.06)){arcAcc=0;regenArcs(open*(1-novaEnv));}
  if(bloom)bloom.strength=0.95+open*0.15+b*0.3+novaEnv*1.4;
  // particle text
  const wo=ease(Math.min(1,Math.max(0,(open-0.3)/0.7)));
  TU.uText.value=wo*(1-novaEnv);morphT=Math.min(1,morphT+dt/1.7);TU.uMorph.value=morphT;
  if(openTarget&&wo>0.6&&novaT<0){langTimer+=dt;if(langTimer>3.4)setLang(li+1,false);}
  // word ring
  const H=innerHeight,W=innerWidth,baseFont=Math.max(11,Math.min(19,W/66)),camLen=camera.position.length();
  for(let i=0;i<NL;i++){
    const a=i/NL*Math.PI*2+U.uTime.value*0.12,R=ringR*wo*(1+novaEnv*0.6);
    v3.set(Math.cos(a)*R,Math.sin(a*2+U.uTime.value*0.6)*0.35*wo,Math.sin(a)*R).applyAxisAngle(XAX,0.28);
    const front=(v3.z/ringR+1)/2,dist=camera.position.distanceTo(v3);v3.project(camera);
    const x=(v3.x*0.5+0.5)*W,y=(-v3.y*0.5+0.5)*H,s=(camLen/dist)*(0.55+front*0.45);const sp=spans[i];
    sp.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-50%) scale(${s.toFixed(3)})`;
    sp.style.fontSize=baseFont+"px";sp.style.opacity=(wo*(1-novaEnv)*(0.12+0.7*front*front)*(i===li?1.3:1)).toFixed(3);
    sp.style.zIndex=String(Math.round(front*100));sp.style.pointerEvents=wo>0.5?"auto":"none";
  }
  // caption under particle text
  v3.set(0,-0.8,0).add(textPts.position).project(camera);
  caption.style.transform=`translate(${((v3.x*0.5+0.5)*W).toFixed(1)}px,${((-v3.y*0.5+0.5)*H).toFixed(1)}px) translate(-50%,0)`;
  caption.style.opacity=String(wo*(1-novaEnv));
  tickScramble(dt);tickTerm(dt);tickRain(dt,open);drawECG();
  if(soundOn&&padFilter)padFilter.frequency.setTargetAtTime(500+open*900+novaEnv*2500,actx.currentTime,0.3);
  // telemetry
  fpsAcc+=dt;fpsN++;if(fpsAcc>0.5){$("t-fps").textContent=String(Math.round(fpsN/fpsAcc));fpsAcc=0;fpsN=0;
    $("t-open").style.width=(open*100).toFixed(0)+"%";$("t-res").textContent=(open*0.7+b*0.2+novaEnv).toFixed(3);}
  // camera + shake
  camera.position.sub(shakeOff);if(controls)controls.update();
  const sk=reduce?0:shakeV+b*0.004;shakeOff.set((Math.random()-.5)*sk,(Math.random()-.5)*sk,0).applyQuaternion(camera.quaternion);camera.position.add(shakeOff);
  composer?composer.render():renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
