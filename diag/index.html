    <script>
// ===================== DIAGNOSTICS (added by xentd, test build) =====================
// Measures, while you play: real timer rates, whether the game overwrites the menu's
// writes, the game's own values at the written addresses, nearby movement constants,
// and which values change while you turn. Nothing here changes gameplay by itself.
var DG = {
  t0: Date.now(), base: null,
  names: { '-950': 'steer(8)', '-1c8': 'speed nsp1', '-260': 'zoom', '-150': 'bg 1', '-140': 'bg 2',
           '-220': 'speed slider', '-180': 'food', '-158': 'name' },
  w: {},            // per address: {n, changed, last, native, nativeAtStart}
  tick: [], raf: [], tickN: 0, rafN: 0, tickRate: 0, rafRate: 0,
  consts: [], startVals: {}, changes: [], dumpPage: 0, snap: null, getOk: null
};
function dgNow() { return (window.performance && performance.now) ? performance.now() : Date.now(); }
function dgOff(addr) {
  if (!DG.base) return addr;
  var d = parseInt(addr, 16) - parseInt(DG.base, 16);
  return (d < 0 ? '-' : '+') + Math.abs(d).toString(16);
}
function dgGet(addr) {
  try { var v = h5gg.getValue(addr, 'F64'); DG.getOk = true; return Number(v); }
  catch (e) { DG.getOk = false; return NaN; }
}
// Every menu write goes through W(): it first reads what is there now. If the value is no
// longer what we wrote last time, the game changed it in between ("lost" write).
function W(addr, val, type) {
  var a = String(addr).toLowerCase();
  var s = DG.w[a] || (DG.w[a] = { n: 0, changed: 0, last: undefined, native: undefined });
  var cur = dgGet(a);
  if (s.last !== undefined && cur === cur && Math.abs(cur - s.last) > 1e-9) { s.changed++; s.native = cur; }
  s.n++; s.last = Number(val);
  return h5gg.setValue(a, val, type);
}
// Timer probes: a plain 1 ms setInterval (what the cheats use) and the screen refresh.
(function () {
  var last = dgNow();
  setInterval(function () {
    var t = dgNow(); DG.tick.push(t - last); last = t; DG.tickN++;
    if (DG.tick.length > 3000) DG.tick.splice(0, DG.tick.length - 3000);
  }, 1);
  var lr = dgNow();
  function f() { var t = dgNow(); DG.raf.push(t - lr); lr = t; DG.rafN++;
    if (DG.raf.length > 600) DG.raf.splice(0, DG.raf.length - 600); requestAnimationFrame(f); }
  if (window.requestAnimationFrame) requestAnimationFrame(f);
  setInterval(function () { DG.tickRate = DG.tickN; DG.rafRate = DG.rafN; DG.tickN = 0; DG.rafN = 0; }, 1000);
})();
function dgPct(arr, p) {
  if (!arr.length) return NaN;
  var s = arr.slice().sort(function (a, b) { return a - b; });
  return s[Math.min(s.length - 1, Math.floor(p / 100 * s.length))];
}
var DG_FROM = -0xC00, DG_TO = 0x200;   // scanned range around the base address
function dgRead(off) { return dgGet('0x' + (parseInt(DG.base, 16) + off).toString(16)); }
// Called once on Start, before any cheat writes begin.
function diagOnStart(base) {
  DG.base = base;
  ['-950', '-1c8', '-260', '-150', '-140'].forEach(function (k) {
    DG.startVals[k] = dgRead(-parseInt(k.slice(1), 16));
  });
  var known = [[4.8, 'spangdv'], [5.39, 'nsp1'], [0.4, 'nsp2'], [14, 'nsp3'], [0.43, 'constrict'],
               [0.033, 'mamu?'], [0.028, 'mamu2?'], [21600, 'grd?'], [411, 'anchor'], [430, 'anchor'], [-1, 'anchor']];
  DG.consts = [];
  for (var off = DG_FROM; off <= DG_TO; off += 8) {
    var v = dgRead(off);
    for (var i = 0; i < known.length; i++)
      if (v === v && Math.abs(v - known[i][0]) < 1e-9) DG.consts.push([off, v, known[i][1]]);
  }
}
function dgHex(off) { return (off < 0 ? '-' : '+') + Math.abs(off).toString(16); }
function dgFmt(v) { return (v === v) ? (Math.abs(v) >= 1e5 || (v !== 0 && Math.abs(v) < 1e-3) ? v.toExponential(3) : (+v.toFixed(4)).toString()) : '?'; }
// Hold a turn, press the button: 6 snapshots over ~1.2 s, list values that keep changing.
function diagChanges() {
  if (!DG.base) { dgShow('Press click!! (Start) first.'); return; }
  var snaps = [], n = 0;
  dgShow('Scanning… keep turning for 1 second');
  var iv = setInterval(function () {
    var s = {};
    for (var off = DG_FROM; off <= DG_TO; off += 8) s[off] = dgRead(off);
    snaps.push(s);
    if (++n >= 6) {
      clearInterval(iv);
      var out = [];
      for (var off2 = DG_FROM; off2 <= DG_TO; off2 += 8) {
        var c = 0;
        for (var j = 1; j < snaps.length; j++) if (snaps[j][off2] !== snaps[j - 1][off2]) c++;
        if (c >= 3) out.push([off2, snaps[0][off2], snaps[snaps.length - 1][off2], c]);
      }
      DG.changes = out;
      diagReport();
    }
  }, 200);
}
function diagReport() {
  var L = [];
  var up = Math.round((Date.now() - DG.t0) / 1000);
  L.push('DIAG v1  ' + new Date().toLocaleString() + '  up ' + up + 's');
  L.push('iOS: ' + ((navigator.userAgent.match(/OS ([\d_]+)/) || [])[1] || '?').replace(/_/g, '.') + '  base ' + (DG.base || 'not started') + '  getValue ' + (DG.getOk === null ? '-' : DG.getOk ? 'ok' : 'FAILED'));
  L.push('TIMER 1ms: ' + DG.tickRate + '/s  gap ms p50 ' + dgFmt(dgPct(DG.tick, 50)) + ' p95 ' + dgFmt(dgPct(DG.tick, 95)) + ' max ' + dgFmt(dgPct(DG.tick, 100)));
  L.push('SCREEN: ' + DG.rafRate + ' fps  frame ms p50 ' + dgFmt(dgPct(DG.raf, 50)) + ' p95 ' + dgFmt(dgPct(DG.raf, 95)) + ' max ' + dgFmt(dgPct(DG.raf, 100)));
  L.push('WRITES (addr: writes, game changed it %, game value, we write):');
  Object.keys(DG.w).forEach(function (a) {
    var s = DG.w[a], o = dgOff(a);
    L.push(' ' + o + ' ' + (DG.names[o] || '') + ': ' + s.n + ', ' + (s.n > 1 ? (100 * s.changed / (s.n - 1)).toFixed(1) : '0') + '%, ' + (s.native === undefined ? '-' : dgFmt(s.native)) + ', ' + dgFmt(s.last));
  });
  L.push('AT START: ' + Object.keys(DG.startVals).map(function (k) { return k + '=' + dgFmt(DG.startVals[k]); }).join(' '));
  L.push('CONSTANTS: ' + (DG.consts.length ? DG.consts.map(function (c) { return dgHex(c[0]) + '=' + dgFmt(c[1]) + '(' + c[2] + ')'; }).join(' ') : '-'));
  L.push('CHANGING WHILE TURNING: ' + (DG.changes.length ? DG.changes.slice(0, 18).map(function (c) { return dgHex(c[0]) + ':' + dgFmt(c[1]) + '>' + dgFmt(c[2]); }).join(' ') + (DG.changes.length > 18 ? ' (+' + (DG.changes.length - 18) + ')' : '') : 'press Find while turning'));
  dgShow(L.join('\n'));
}
function diagDump() {
  if (!DG.base) { dgShow('Press click!! (Start) first.'); return; }
  var per = 60, all = [];
  for (var off = DG_FROM; off <= DG_TO; off += 8) { var v = dgRead(off); if (v === v && v !== 0) all.push(dgHex(off) + '=' + dgFmt(v)); }
  var pages = Math.max(1, Math.ceil(all.length / per)), p = DG.dumpPage % pages;
  DG.dumpPage++;
  dgShow('DUMP page ' + (p + 1) + '/' + pages + ' (non-zero F64, offset from base)\n' + all.slice(p * per, (p + 1) * per).join('  '));
}
function diagReset() { Object.keys(DG.w).forEach(function (a) { DG.w[a].n = 0; DG.w[a].changed = 0; }); DG.tick = []; DG.raf = []; DG.changes = []; diagReport(); }
var dgOpen = false;
function dgShow(text) {
  var box = document.getElementById('dgBox');
  document.getElementById('dgText').textContent = text;
  box.style.display = 'block';
  if (!dgOpen) { dgOpen = true; setWindowRect(330, 10, 520, 360); }
}
function diagClose() {
  document.getElementById('dgBox').style.display = 'none';
  dgOpen = false; setWindowRect(500, 60, 300, 215);
}
// =================== END DIAGNOSTICS ===================

let baseAddress = null; // baseAddress の初期値
let zoomLocker = null; // ズーム用のロック用変数
let zoom2Locker = null; // ズーム用のロック用変数
let speedLocker = null; // スピード用のロック用変数
let freezeLocker = null; // フリーズ用のロック用変数
let effectLocker = null; // フリーズ用のロック用変数
let clockInterval = null; // 時刻表示用のインターバルを管理する変数

// 時刻更新用の関数を定義
function updateTime() {
    const ttt = document.getElementById("ttt");
    const content = document.getElementById('content');
    const isVisible = content.style.display === 'block';

    const nowTime = new Date();
    const nowHour = nowTime.getHours().toString().padStart(2, '0');
    const nowMin = nowTime.getMinutes().toString().padStart(2, '0');
    const month = (nowTime.getMonth() + 1).toString().padStart(2, '0'); // 月（0ベースなので+1）
    const day = nowTime.getDate().toString().padStart(2, '0'); 
    const timeString = + month + "/" + day + "&nbsp" +nowHour + ":" + nowMin;

    // ウィンドウの開閉状態に応じて表示を切り替え
    ttt.innerHTML = isVisible ? "&nbsp;🎅&nbsp;Slither.io " + timeString : "&nbsp;🫎&nbsp;Slither.io " + timeString;
}

function openwindow() {
    const content = document.getElementById('content');
    const isVisible = content.style.display === 'block';

    content.style.display = isVisible ? 'none' : 'block'; // コンテンツをトグル

    // ウィンドウの開閉に応じてウィンドウサイズを変更
    setWindowRect(500, 60, 300, isVisible ? 80 : 185);
}

// 初回ロード時にリアルタイムの時刻表示を開始
if (clockInterval === null) {
    clockInterval = setInterval(updateTime, 1); // 1秒ごとに時刻を更新
}

function toggleSlider() {
    const zoomCheckbox = document.getElementById('zoomCheckbox');
    document.getElementById('zzom').disabled = !zoomCheckbox.checked;

    // チェックが外れた場合、ロックをクリア
    if (!zoomCheckbox.checked && zoomLocker) {
        clearInterval(zoomLocker);
        zoomLocker = null; // ズームロッカーをリセット
    }
}

function toggleSlider2() {
    const speedCheckbox = document.getElementById('speedCheckbox');
    document.getElementById('spped').disabled = !speedCheckbox.checked;

    // チェックが外れた場合、ロックをクリア
    if (!speedCheckbox.checked && speedLocker) {
        clearInterval(speedLocker);
        speedLocker = null; // スピードロッカーをリセット
        let baseAddressNum = parseInt(baseAddress, 16);
    
    // baseAddressから0x220を引き算してspeedを計算
    let speed = baseAddressNum - 0x220;
        W("0x" + (speed).toString(16), 1, 'F64');
        
    }
}

function startExecution() {
    h5gg.clearResults();
    h5gg.searchNumber('-1', 'F64', '0x000000000', '0x290000000');
    h5gg.searchNearby('411', 'F64', '0x8');
    let results = h5gg.getResults(1, 0);

    if (results.length > 0) {
        baseAddress = results[0].address; // baseAddressを取得
    } else {
        h5gg.clearResults();
        h5gg.searchNumber('-1', 'F64', '0x000000000', '0x290000000')
        h5gg.searchNearby('430', 'F64', '0x8');
        results = h5gg.getResults(1, 0);
        if (results.length > 0) {
            baseAddress = results[0].address; // baseAddressを取得
        }
    }
        if (baseAddress) { try { diagOnStart(baseAddress); } catch (e) {} }
        if (baseAddress) {
    const spaceAddress = (parseInt(baseAddress, 16) - 0x950).toString(16);

    spaceLocker = setInterval(function() {
        if (!ctrl.off) W('0x' + spaceAddress, ctrl.val, 'F64');
    }, 1);
}
    const titlebar = document.getElementById('titlebar');
    const content = document.getElementById('content');
    titlebar.style.display = baseAddress ? 'block' : 'none';
    content.style.display = baseAddress ? 'block' : 'none';
    if (baseAddress) {
        document.querySelector('.start-button').style.display = 'none';
                document.querySelector('.farstcontent').style.display = 'none';
        setWindowRect(500, 60, 300, 215);
        setWindowDrag(0, 0, 300, 25);
    }
}

    

// フリーズ機能
document.getElementById('backblack').addEventListener('change', function() {
    if (this.checked) {
        // チェックされたとき、baseAddressから0xf8を引いた値を0にする
        if (baseAddress !== null) {
            const black = (parseInt(baseAddress, 16) - 0x150).toString(16);
            const black2 = (parseInt(baseAddress, 16) - 0x140).toString(16);

            // フリーズを開始
            freezeLocker = setInterval(function() {
                W('0x' + black, 0, 'F64');
                W('0x' + black2, 0, 'F64');
            }, 1); // 250msごとに値を更新
        }
    } else {
        // チェックが外れた場合、フリーズロックをクリア
        if (freezeLocker !== null) {
            clearInterval(freezeLocker);

        }
    }
});

        }

document.getElementById('bigname').addEventListener('change', function() {

            }, 10); // 250msごとに値を更新
        }
    } else {
        // チェックが外れた場合、フリーズロックをクリア
        if (nameLocker !== null) {

            nameLocker = null; // フリーズロッカーをリセット
            const name = (parseInt(baseAddress, 16) - 0x238).toString(16);

});

document.getElementById('zoomwhere').addEventListener('change', function() {
    const zzom2 = document.getElementById('zzomsec');
    // チェックボックスの状態に応じて、zzom2の表示・非表示を切り替える
    zzom2.style.display = this.checked ? 'inline-block' : 'none';

function zoome2() {
        let slidersec = parseFloat(document.getElementById("zzomsec").value);
    
    // baseAddressが文字列である場合を考慮し、16進数の数値に変換する
    let baseAddressNum = parseInt(baseAddress, 16);
    
    // baseAddressから0x168を引き算してzoomを計算
    let zoom = baseAddressNum - 0x260;

    // zoomがNaNでないかをチェック
    if (!isNaN(zoom)) {
        // ズームインターバルが既に存在する場合、クリアして再設定する
        if (zoom2Locker !== null) {
            clearInterval(zoom2Locker);
        }

        // スライダーの値をメモリアドレスに定期的に書き込む
        zoom2Locker = setInterval(function() {
            W("0x" + (zoom).toString(16), slidersec, 'F64');
        }, 1);  // 1msごとに値を更新
    }
}

var ctrl = { val: 8, off: false };
try {
    var saved = JSON.parse(localStorage.getItem('ctrlTuning') || 'null');
    if (saved && typeof saved.val === 'number') { ctrl.val = saved.val; ctrl.off = !!saved.off; }
} catch (e) {}
function ctrlSave() { try { localStorage.setItem('ctrlTuning', JSON.stringify(ctrl)); } catch (e) {} }
function ctrlRender() {
    document.getElementById('ctrlVal').value = ctrl.val;
    document.getElementById('ctrlShow').textContent = ctrl.off ? 'off' : ctrl.val;
    document.getElementById('ctrlOff').checked = ctrl.off;
}
document.getElementById('ctrlVal').addEventListener('input', function () {

});
document.getElementById('ctrlOff').addEventListener('change', function () {
    ctrl.off = this.checked; ctrlRender(); ctrlSave();
});
