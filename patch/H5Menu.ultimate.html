// iOS 18 timer rhythm (Ultimate Test on iOS 18.5, rhythm off: 246/s, steady 4 ms). iOS 26 runs
// these 1 ms timers ~123/s at ~8 ms; this runs every 1 ms setInterval on an even 4.06 ms beat instead.
(function () {
  var nativeSet = window.setInterval, nativeClear = window.clearInterval;
  window.__nativeSet = nativeSet;
  window.__rhythmOn = true;
  var tasks = {}, nextId = 1e6, running = false, STEP_MS = 4.06, last = 0;
  var now = (window.performance && performance.now) ? function () { return performance.now(); } : Date.now;
  var ch = new MessageChannel();
  ch.port1.onmessage = function () {
    var any = false; for (var k in tasks) { any = true; break; }
    if (!any) { running = false; return; }
    var t = now();
    if (t - last >= STEP_MS) {
      last = (t - last > STEP_MS * 3) ? t : last + STEP_MS;
      for (var j in tasks) { try { tasks[j](); } catch (e) {} }
    }
    ch.port2.postMessage(0);
  };
  window.setInterval = function (fn, ms) {
    if (window.__rhythmOn && typeof fn === 'function' && (ms === undefined || ms <= 1)) {
      var id = nextId++; tasks[id] = fn;
      if (!running) { running = true; last = now(); ch.port2.postMessage(0); }
      return id;
    }
    return nativeSet.apply(window, arguments);
  };
  window.clearInterval = function (id) {
    if (id in tasks) { delete tasks[id]; return; }
    return nativeClear.apply(window, arguments);
  };
})();
</script>

<script>
// ===================== ULTIMATE TEST (xentd) =====================
// One guided run, same on every phone. Reads game memory only; changes nothing in the game.
//  A. timers   - native 1 ms setInterval rate/jitter, cheat pump rate/jitter, screen fps/jitter
//  B. turning  - finds the heading in memory, measures turn speed vs the game's own cap
//  C. pacing   - each heading step = cap x that frame's duration -> game frame times
//  D. input    - finds the game's wanted angle (where your finger points): update rate, gaps,
//                and how long the heading takes to follow it (lag, by cross-correlation)
//  E. zoom     - how often the zoom value holds, how often the game snaps it, and to what
//  F. cheats   - how often each written value holds
var UT = { base: null, nat: [], natN: 0, natRate: 0, pump: [], pumpN: 0, pumpRate: 0, raf: [], rafN: 0, rafRate: 0, running: false };
function utNow() { return (window.performance && performance.now) ? performance.now() : Date.now(); }
function utGet(off) { try { return Number(h5gg.getValue('0x' + (parseInt(UT.base, 16) + off).toString(16), 'F64')); } catch (e) { return NaN; } }
function utPct(a, p) { if (!a.length) return NaN; var s = a.slice().sort(function (x, y) { return x - y; }); return s[Math.min(s.length - 1, Math.floor(p / 100 * s.length))]; }
function utF(v, d) { return (v === v && v !== undefined) ? (+v.toFixed(d === undefined ? 1 : d)).toString() : '-'; }
function utHex(o) { return (o < 0 ? '-' : '+') + Math.abs(o).toString(16); }
function utAngDiff(a, b) { var d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }
// background probes: native 1 ms timer (bypasses the rhythm pump), the cheat pump, the screen
(function () {
  var NS = window.__nativeSet || window.setInterval, ln = utNow(), lp = utNow(), lr = utNow();
  NS(function () { var t = utNow(); UT.nat.push(t - ln); ln = t; UT.natN++; if (UT.nat.length > 2000) UT.nat.splice(0, 1000); }, 1);
  window.setInterval(function () { var t = utNow(); UT.pump.push(t - lp); lp = t; UT.pumpN++; if (UT.pump.length > 2000) UT.pump.splice(0, 1000); }, 1);
  function f() { var t = utNow(); UT.raf.push(t - lr); lr = t; UT.rafN++; if (UT.raf.length > 600) UT.raf.splice(0, 300); requestAnimationFrame(f); }
  if (window.requestAnimationFrame) requestAnimationFrame(f);
  NS(function () { UT.natRate = UT.natN; UT.pumpRate = UT.pumpN; UT.rafRate = UT.rafN; UT.natN = UT.pumpN = UT.rafN = 0;
    var el = document.getElementById('utLive'); if (el) el.textContent = 'live: iOS timer ' + UT.natRate + '/s  cheats ' + (window.__rhythmOn ? UT.pumpRate : UT.natRate) + '/s  screen ' + UT.rafRate + 'fps'; }, 1000);
})();
// fast sampler that is independent of both the native timer and the pump
function utSampler(stepMs, fn) {
  var ch = new MessageChannel(), on = true, last = 0;
  ch.port1.onmessage = function () { if (!on) return; var t = utNow(); if (t - last >= stepMs) { last = t; fn(t); } ch.port2.postMessage(0); };
  ch.port2.postMessage(0);
  return function () { on = false; };
}
var UT_FROM = -0xC00, UT_TO = 0x200;
var UT_CHEATS = [[-0x950, 'steer 8'], [-0x260, 'zoom'], [-0x1c8, 'speed'], [-0x250, 'food'], [-0x238, 'name'], [-0x150, 'bg1'], [-0x140, 'bg2']];
function utShow(t) {

  document.getElementById('utText').textContent = t; box.style.display = 'block';
  if (!UT.open) { UT.open = true; setWindowRect(330, 10, 520, 360); }
}

function utClose() { document.getElementById('utBox').style.display = 'none'; UT.open = false; setWindowRect(500, 60, 300, 215); }
function ultimateTest() {

}
function utAnalyseAngle(s) {

    }); });

  if (head && !pair) Object.keys(A).forEach(function (l) {
